services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unitraack-backend
    env_file:
      - ./backend/.env
    ports:
      - "3333:3333"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unitraack-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped